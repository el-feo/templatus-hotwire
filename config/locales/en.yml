# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: 'ON'

en:
  clicks:
    create:
      success: Click was successfully recorded.
      fail: Click recording failed!

  organizations:
    create:
      success: Organization created. You are its first admin.

  organization_settings:
    update:
      success: Settings saved.

  memberships:
    create:
      success: '%{email} is now a member.'
      unknown_user: Nobody has signed up with that address yet.
    update:
      success: Role updated.
    destroy:
      success: Membership removed.

  tenant:
    role_required: You do not have access to that part of this organization.

  activerecord:
    errors:
      models:
        organization:
          attributes:
            name:
              no_slug: must contain at least one letter or digit to build an address from
        membership:
          attributes:
            base:
              last_admin: An organization needs at least one admin, and this is the last one.
            role:
              last_admin: cannot be changed - an organization needs at least one admin
